[package]
name = "deemer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Run AI-assisted integration tests that judge whether your tests passed"
readme = "../../README.md"
keywords = ["cli", "testing", "integration", "ai", "llm"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "deemer"
path = "src/main.rs"

[dependencies]
deemer-core.workspace = true
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
semver.workspace = true
chrono.workspace = true
dirs.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/deemer-v{ version }-{ target }.{ archive-format }"
bin-dir = "deemer{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
